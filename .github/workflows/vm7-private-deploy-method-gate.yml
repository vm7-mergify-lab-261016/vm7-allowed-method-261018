name: VM7 attacker-controlled squash deploy 261019

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-after-owner-authorized-squash:
    runs-on: ubuntu-latest
    environment: vm7-allowed-method-prod
    steps:
      - name: Write same protected private release marker
        shell: bash
        env:
          VM7_DEPLOY_KEY: ${{ secrets.VM7_DEPLOY_KEY }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VM7_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          git clone --quiet git@github.com:vm7-mergify-lab-261016/vm7-allowed-method-deploy-target-261018.git deploy-target
          cd deploy-target
          printf 'source_commit=%s\nparent_count=1\nattacker_workflow=true\n' "$SOURCE_SHA" > release-from-merge.txt
          git config user.name 'VM7 Trusted Release Automation'
          git config user.email 'vm7-trusted-release-automation@example.invalid'
          git add release-from-merge.txt
          git commit -m "Deploy attacker-controlled allowed squash $SOURCE_SHA"
          git push --quiet origin HEAD:main
